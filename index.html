<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#3b2240">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keratin Appointments</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3ef;--bg2:#efe4e6;--card:#fffdfc;--ink:#2a2029;--mut:#75666f;--rose:#d98ea4;--rose-d:#963f5f;--rose-m:#b4557a;--rose2:#f6e3ea;--gold:#8a5f26;--gold2:#e4c58c;--ok:#22654c;--bad:#963848;--line:#ebdbe0;
--sh:0 1px 2px rgba(60,30,60,.05),0 10px 28px -12px rgba(80,40,80,.2);--sh2:0 14px 30px -10px rgba(185,105,123,.55);
--hero:radial-gradient(120% 90% at 50% 0%,#6a3a63 0%,#3b2240 55%,#211425 100%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161118;--bg2:#1f1722;--card:#251c28;--ink:#f6ecef;--mut:#b5a4b2;--rose2:#3d2638;--line:#3a2c3c;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);--hero:radial-gradient(120% 90% at 50% 0%,#5a2f55 0%,#26162b 60%,#120b14 100%)}}
:root[data-theme="dark"]{--bg:#161118;--bg2:#1f1722;--card:#251c28;--ink:#f6ecef;--mut:#b5a4b2;--rose2:#3d2638;--line:#3a2c3c;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);--hero:radial-gradient(120% 90% at 50% 0%,#5a2f55 0%,#26162b 60%,#120b14 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
background:radial-gradient(60% 40% at 0% 30%,rgba(170,110,170,.13),transparent 70%),radial-gradient(50% 35% at 100% 70%,rgba(228,197,140,.16),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}

/* ---------- Hero ---------- */
.hero{background:var(--hero);color:#fff;margin:0 -16px 26px;padding:58px 20px 38px;text-align:center;border-radius:0 0 40px 40px;position:relative;overflow:hidden;box-shadow:0 20px 40px -24px rgba(40,18,45,.7)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(6px)}
.hero:before{width:300px;height:300px;top:-120px;left:-110px;background:radial-gradient(circle,rgba(190,120,190,.38),transparent 68%);animation:drift 14s ease-in-out infinite alternate}
.hero:after{width:260px;height:260px;bottom:-120px;right:-90px;background:radial-gradient(circle,rgba(228,197,140,.38),transparent 68%);animation:drift 16s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(28px,18px) scale(1.08)}}
.hero .shine{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.018) 22px 23px);pointer-events:none}
.frame{position:relative;z-index:1;display:inline-block;padding:4px;border-radius:999px 999px 26px 26px;background:linear-gradient(160deg,#f5e2b8,var(--gold2) 40%,#9c7034);box-shadow:0 18px 36px -14px rgba(0,0,0,.6)}
.frame:after{content:"✦";position:absolute;right:-12px;bottom:18px;width:30px;height:30px;line-height:30px;border-radius:50%;background:var(--rose);color:#fff;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);border:2px solid #f5e2b8}
.ph{display:block;width:142px;height:178px;border-radius:999px 999px 22px 22px;object-fit:cover;border:3px solid #2b2125}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:42px;line-height:1.05;margin:20px 0 10px;position:relative;z-index:1;font-weight:600;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:500;background:linear-gradient(100deg,#f7e6c1,var(--gold2) 45%,#e9b6c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 auto;color:#f0d6dc;letter-spacing:.24em;text-transform:uppercase;font-size:11px;font-weight:500;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:12px;max-width:340px}
.sub:before,.sub:after{content:"";flex:1;max-width:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(228,197,140,.8))}.sub:after{transform:scaleX(-1)}
.lang{position:absolute;top:16px;left:16px;z-index:2;display:flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lang button{border:0;background:transparent;color:rgba(255,255,255,.75);border-radius:99px;padding:5px 12px;font:inherit;font-size:12px;font-weight:500;letter-spacing:.08em;cursor:pointer;transition:all .25s}
.lang button.on{background:var(--gold2);color:#2a2226;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.adm{position:absolute;top:14px;right:14px;z-index:2;background:none;border:0;color:var(--gold2);opacity:.28;font-size:18px;cursor:pointer;padding:8px;transition:opacity .2s}.adm:hover{opacity:.7}

/* ---------- Secciones ---------- */
h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;font-weight:600;margin:28px 0 12px;display:flex;align-items:center;gap:12px;letter-spacing:-.005em}
h2:before{content:"✦";font-size:12px;color:var(--gold);font-family:'Jost',sans-serif}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h2:empty{display:none}
.top{display:flex;justify-content:flex-end;margin-bottom:12px}

/* ---------- Días ---------- */
.days{display:flex;gap:10px;overflow-x:auto;padding:6px 4px 16px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 16px,#000 calc(100% - 28px),transparent)}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 66px;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:11px 0 10px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,background .2s}
.day:hover{transform:translateY(-2px)}
.day small{display:block;text-transform:uppercase;font-size:10.5px;letter-spacing:.12em;color:var(--mut);font-weight:500}
.day b{display:block;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1.05;margin:1px 0}
.day.sel{background:linear-gradient(165deg,var(--rose-m),var(--rose-d));border-color:transparent;color:#fff;box-shadow:var(--sh2);transform:translateY(-3px)}
.day.sel small{color:rgba(255,255,255,.88)}
.day.off{opacity:.42;box-shadow:none;background:transparent;border-style:dashed}
.day.off.sel{opacity:.75;background:linear-gradient(165deg,#a99aa0,#7d6d74)}

/* ---------- Turnos ---------- */
.slot{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden;animation:rise .4s ease both}
.slot:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--gold2),var(--rose))}
.slot:nth-child(2){animation-delay:.05s}.slot:nth-child(3){animation-delay:.1s}
#slots.still .slot{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.slot .t{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;min-width:92px;line-height:1}
.slot .i{flex:1;min-width:0}.slot .i small{color:var(--mut);display:block;font-size:13px;margin-bottom:4px}
.slot .i span{display:block;overflow-wrap:anywhere}
.slot>b{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-right:6px}
.slot>small{font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 11px;border-radius:99px;font-weight:600;letter-spacing:.03em;vertical-align:middle}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.slot .i span.tag{display:inline-flex}
.free{background:#e1f2ea;color:var(--ok)}.busy{background:#f8e0e4;color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .free{background:#1c3a30;color:#7fd3b0}:root:not([data-theme="light"]) .busy{background:#47252e;color:#f0a5b2}}
:root[data-theme="dark"] .free{background:#1c3a30;color:#7fd3b0}:root[data-theme="dark"] .busy{background:#47233a;color:#f0a5b2}

/* ---------- Botones ---------- */
.btn{border:0;border-radius:99px;padding:12px 22px;font:inherit;font-weight:500;letter-spacing:.02em;cursor:pointer;background:linear-gradient(160deg,#f1d9a8,var(--gold2) 45%,#c99a56);color:#2a2226;box-shadow:0 6px 16px -8px rgba(168,121,58,.7);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.rose{background:linear-gradient(160deg,var(--rose-m),var(--rose-d));color:#fff;box-shadow:0 8px 18px -8px rgba(185,105,123,.8)}
.btn.ghost{background:transparent;border:1px solid var(--rose);color:var(--ink);box-shadow:none}
.btn.sm{padding:8px 15px;font-size:14px}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.opts{display:flex;gap:8px;margin-top:14px}
.opts .btn{flex:1;font-size:16px;padding:12px 6px;background:var(--bg);border:1px solid var(--line);color:var(--ink);box-shadow:none;font-weight:500}
.opts .btn:hover:not(:disabled){background:linear-gradient(160deg,#f1d9a8,var(--gold2) 45%,#c99a56);border-color:transparent;color:#2a2226;box-shadow:0 6px 16px -8px rgba(168,121,58,.7)}
.btn:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through;transform:none;filter:none}
a{color:var(--gold)}
.empty{text-align:center;color:var(--mut);padding:26px 20px;background:var(--card);border-radius:24px;border:1px dashed var(--line);margin-bottom:12px}

/* ---------- Hoja inferior ---------- */
.ov{position:fixed;inset:0;background:rgba(25,15,20,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:32px 32px 0 0;padding:30px 22px calc(26px + env(safe-area-inset-bottom,0px));position:relative;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet:before{content:"";position:absolute;top:10px;left:50%;width:42px;height:4px;margin-left:-21px;border-radius:4px;background:var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-family:'Cormorant Garamond',serif;margin:0 0 4px;font-size:28px;font-weight:600}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;font-weight:500}
label input[type=checkbox]{accent-color:var(--rose-d);width:auto}
.cfg label{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
input,select{width:100%;padding:13px 15px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=checkbox]{appearance:auto;-webkit-appearance:auto;padding:0}
input:focus,select:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgba(217,145,159,.2)}
.row{display:flex;gap:10px;margin-top:22px}.row .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.own{background:var(--rose2);border-radius:20px;padding:14px 16px;margin-top:6px}
.cfg{background:var(--card);border:1px solid var(--gold2);border-radius:24px;padding:6px 18px 18px;margin-top:6px;box-shadow:var(--sh)}
.cfg .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- Toast / pie ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(42,34,38,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:12px 22px;border-radius:20px;z-index:30;display:none;max-width:90%;text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);border:1px solid rgba(228,197,140,.3);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
.note{text-align:center;color:var(--mut);font-size:13px;margin:30px 0 0}
.foot{text-align:center;margin-top:14px;color:var(--gold);letter-spacing:.5em;font-size:11px;opacity:.7}
@media (min-width:600px){.hero{margin-top:18px;border-radius:40px}.days{margin:0;padding-left:4px;padding-right:4px}}

/* ---------- Accesibilidad / interacción ---------- */
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--rose-d);outline-offset:3px;border-radius:12px}
.hero :focus-visible{outline-color:var(--gold2)}
.btn,.day,.lang button,.adm{cursor:pointer;touch-action:manipulation}
.btn.sm{min-height:44px;padding:10px 16px}
.opts{flex-wrap:wrap}.opts .btn{flex:1 1 calc(33% - 8px);min-width:84px}
.lang button{min-height:38px;padding:8px 14px}
.adm{min-width:44px;min-height:44px}
.day{min-height:84px}
.chk{display:flex!important;gap:10px;align-items:center;text-transform:none!important;letter-spacing:0!important;font-size:15px!important;color:var(--ink)!important;min-height:44px;cursor:pointer;margin-top:10px!important}
.chk input{width:20px!important;height:20px;accent-color:var(--rose-d)}
.telrow{display:grid;grid-template-columns:84px 1fr;gap:8px}.telrow #cc{text-align:center;font-weight:500}
.months{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding:2px}
.months::-webkit-scrollbar{display:none}
.months button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;min-height:40px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-transform:capitalize;transition:background .2s,color .2s}
.months button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.admbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--rose2);color:var(--ink);border-radius:99px;padding:2px 4px 2px 12px;font-size:14px;font-weight:500}
.chip button{border:0;background:transparent;color:var(--ink);font-size:18px;line-height:1;width:32px;height:32px;border-radius:50%;cursor:pointer}
.chip button:hover{background:rgba(0,0,0,.08)}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
textarea{width:100%;padding:13px 15px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgba(217,145,159,.2)}
.crow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cnt{display:inline-block;font-family:'Jost',sans-serif;font-size:13px;font-weight:600;background:var(--rose2);border-radius:99px;padding:2px 10px;vertical-align:middle}
.clist{margin-top:12px;max-height:46vh;overflow:auto;border-radius:18px}
.citem{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.citem:last-child{border-bottom:0}
.ci{flex:1;min-width:0}.ci b{display:block;overflow-wrap:anywhere}.ci small{display:block;color:var(--mut);font-size:13px}
.ci .cn{color:var(--ink);opacity:.8;font-style:italic;margin-top:2px}
.ca{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.danger{border-color:var(--bad);color:var(--bad)}
@media (max-width:420px){.citem{flex-wrap:wrap}.ca{width:100%;justify-content:flex-start}}
.hint{display:block;color:var(--mut);font-size:12.5px;margin-top:6px;line-height:1.35}
.field-err{display:block;color:var(--bad);font-size:13px;margin-top:6px}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 4px rgba(150,56,72,.14)}
.btn.loading{pointer-events:none;opacity:.8}
.btn.loading:after{content:"";display:inline-block;width:14px;height:14px;margin-left:10px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{height:132px;border-radius:24px;margin-bottom:12px;background:linear-gradient(100deg,var(--card) 30%,var(--bg2) 50%,var(--card) 70%);background-size:300% 100%;border:1px solid var(--line);animation:shim 1.4s ease-in-out infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.trt{display:block;color:var(--gold);font-weight:500;font-size:13px;margin-top:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mut:#b2a3aa;--gold:#d9b06a;--ok:#7fd3b0;--bad:#f0a5b2}}
:root[data-theme="dark"]{--mut:#b2a3aa;--gold:#d9b06a;--ok:#7fd3b0;--bad:#f0a5b2}
/* ---------- Servicios ---------- */
.svc{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);overflow:hidden;margin-top:4px}
.svc details{border-top:1px solid var(--line)}.svc details:first-child{border-top:0}
.svc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:18px 18px 16px;cursor:pointer;min-height:56px;touch-action:manipulation}
.svc summary::-webkit-details-marker{display:none}
.svc summary b{flex:1;font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:600;line-height:1.1;transition:color .2s}
.svc summary:after{content:"";flex:0 0 auto;width:8px;height:8px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .25s}
.svc details[open] summary:after{transform:rotate(-135deg);margin-bottom:-2px}
.svc summary:hover b{color:var(--rose-d)}
.svc .sb{padding:0 18px 20px;animation:rise .3s ease both}
.svc .sd{margin:0 0 12px;color:var(--mut);font-size:14.5px;max-width:60ch}
.svc ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.svc li{background:var(--rose2);color:var(--ink);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;line-height:1.3}
.svc li.sub2{width:100%;margin-top:4px;padding:12px 14px 14px;border-radius:18px;background:var(--bg);border:1px dashed var(--line)}
.svc .sub2 small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
.svc .sub2 ul li{background:var(--card);border:1px solid var(--line)}
.svc li i{font-style:normal;color:var(--mut);font-weight:400}
.svc .cta{display:flex;justify-content:center;padding:6px 18px 20px;border-top:1px solid var(--line);padding-top:18px}
:root[data-theme="dark"] .svc summary:hover b{color:var(--gold2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .svc summary:hover b{color:var(--gold2)}}
/* ---------- Políticas de servicio ---------- */
.pol{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:6px 18px;margin-top:4px}
.pol ul{list-style:none;margin:0;padding:0}
.pol li{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}.pol li:first-child{border-top:0}
.pol .ic{flex:0 0 38px;height:38px;border-radius:12px;background:var(--rose2);color:var(--rose-d);display:grid;place-items:center}
.pol .ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pol b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:600;line-height:1.15;margin:1px 0 4px}
.pol p{margin:0;color:var(--mut);font-size:14.5px;line-height:1.5;max-width:60ch}
:root[data-theme="dark"] .pol .ic{color:var(--gold2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pol .ic{color:var(--gold2)}}
/* ---------- Carrusel de resultados ---------- */
.gal{position:relative;margin-top:4px}
.gal .track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:4px 16px 14px;scroll-padding:0 16px;overscroll-behavior-x:contain}
.gal .track::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 78%;max-width:320px;margin:0;scroll-snap-align:start;border-radius:24px;overflow:hidden;background:var(--bg2);box-shadow:var(--sh);border:1px solid var(--line);aspect-ratio:3/4}
.gal img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.gal figure:hover img{transform:scale(1.03)}
.gal .nav{position:absolute;top:calc(50% - 32px);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--sh);display:none;place-items:center;cursor:pointer;transition:opacity .2s,transform .15s}
.gal .nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gal .nav:hover{transform:scale(1.06)}.gal .nav:disabled{opacity:0;pointer-events:none}
.gal .prev{left:-8px}.gal .next{right:-8px}
.gal .dots{display:flex;justify-content:center;gap:7px}
.gal .dots button{width:8px;height:8px;padding:0;border:0;border-radius:99px;background:var(--line);cursor:pointer;transition:width .3s,background .3s}
.gal .dots button.on{width:24px;background:var(--rose-m)}
@media (hover:hover) and (min-width:600px){.gal .nav{display:grid}.gal .track{margin:0;padding-left:2px;padding-right:2px;scroll-padding:0}.gal figure{flex-basis:calc((100% - 24px)/2.4)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
/* ===== DIRECCIÓN DEL SERVIDOR EN RAILWAY =====
   Pegá acá la URL de Railway, sin barra al final. Ej: "https://maia-alisados-production.up.railway.app"
   (Si abrís la página desde la propia URL de Railway, se conecta sola.) */
var RAILWAY_URL = "";
var API_URL = RAILWAY_URL.replace(/\/+$/,""); // vacío = mismo servidor que la página
/* ============================================= */
var adminPw="",listeners={},connErr=false,LD={},lastDias=null,lastTurnos=null,firstPaint=true;
function api(path,opt){opt=opt||{};var h={"Content-Type":"application/json"};if(adminPw)h["x-admin"]=adminPw;opt.headers=h;
 if(!API_URL&&/github\.io$/.test(location.hostname))return Promise.reject(new Error(lang==="es"?"falta pegar la URL de Railway en RAILWAY_URL":"Railway URL missing in RAILWAY_URL"));
 return fetch(API_URL+path,opt).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function poll(c){api("/api/"+c+"?uid="+encodeURIComponent(uid||"")).then(function(rows){
  if(connErr){connErr=false;var w=document.getElementById("connw");if(w)w.remove()}
  LD[c]=true;var docs=rows.map(function(r){return{id:r.id,data:function(){return r.data}}});
  (listeners[c]||[]).forEach(function(f){f({docs:docs})})})
 .catch(function(e){console.error(e);if(!connErr){connErr=true;render();$("slots").insertAdjacentHTML("beforebegin",'<div class="empty" id="connw">'+T("signin")+'<small style="display:block;margin-top:8px;opacity:.75">('+esc(e.message)+')</small></div>')}})}
function refresh(){Object.keys(listeners).forEach(poll)}
setInterval(refresh,8000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()});
var RDB={collection:function(c){return{
 onSnapshot:function(f){(listeners[c]=listeners[c]||[]).push(f);poll(c)},
 doc:function(id){var u="/api/"+c+"/"+encodeURIComponent(id),q="?uid="+encodeURIComponent(uid||"");return{
  get:function(){return api(u+q).then(function(r){return{exists:r.exists,data:function(){return r.data}}})},
  set:function(d){return api(u+q,{method:"PUT",body:JSON.stringify(d)}).then(refresh)},
  delete:function(){return api(u+q,{method:"DELETE"}).then(refresh)}}}}}};

 ["cal","Cancelaciones y reprogramaciones","Cancellations & rescheduling","Deben notificarse con al menos 48 horas de anticipación. De lo contrario, se requerirá un depósito para agendar una nueva cita.","Please let us know at least 48 hours in advance. Otherwise, a deposit will be required to book a new appointment."],

function renderGal(){var es=lang==="es",ix=es?1:2,box=$("gal");
 if(galBuilt===lang)return;galBuilt=lang;
 var ch='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',cn='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
 box.innerHTML='<h2>'+(es?"Nuestros resultados":"Our results")+'</h2><div class="gal" role="region" aria-roledescription="'+(es?"carrusel":"carousel")+'" aria-label="'+(es?"Fotos de resultados":"Results photos")+'">'+
  '<div class="track" tabindex="0">'+FOTOS.map(function(f,i){return '<figure aria-label="'+(i+1)+' / '+FOTOS.length+'"><img src="'+f[0]+'" alt="'+f[ix]+'" loading="lazy" decoding="async" width="600" height="800"></figure>'}).join("")+'</div>'+
  '<button type="button" class="nav prev" aria-label="'+(es?"Foto anterior":"Previous photo")+'">'+ch+'</button><button type="button" class="nav next" aria-label="'+(es?"Foto siguiente":"Next photo")+'">'+cn+'</button>'+
  '<div class="dots">'+FOTOS.map(function(f,i){return '<button type="button" aria-label="'+(es?"Ir a la foto ":"Go to photo ")+(i+1)+'"></button>'}).join("")+'</div></div>';
 var tr=box.querySelector(".track"),figs=tr.children,dots=box.querySelectorAll(".dots button"),pv=box.querySelector(".prev"),nx=box.querySelector(".next");
 function cur(){var x=tr.scrollLeft,best=0,d=1e9;for(var i=0;i<figs.length;i++){var k=Math.abs(figs[i].offsetLeft-tr.offsetLeft-x-(figs[0].offsetLeft-tr.offsetLeft));if(k<d){d=k;best=i}}return best}
 function go(i){i=Math.max(0,Math.min(figs.length-1,i));tr.scrollTo({left:figs[i].offsetLeft-figs[0].offsetLeft,behavior:"smooth"})}
 function upd(){var c=cur(),end=tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-4;if(end)c=figs.length-1;
  for(var i=0;i<dots.length;i++){dots[i].classList.toggle("on",i===c);dots[i].setAttribute("aria-current",i===c?"true":"false")}
  pv.disabled=tr.scrollLeft<4;nx.disabled=end}
 var t;tr.addEventListener("scroll",function(){clearTimeout(t);t=setTimeout(upd,60)},{passive:true});
 pv.onclick=function(){go(cur()-1)};nx.onclick=function(){go(cur()+1)};
 for(var i=0;i<dots.length;i++)(function(i){dots[i].onclick=function(){go(i)}})(i);
 tr.onkeydown=function(e){if(e.key==="ArrowRight"){e.preventDefault();go(cur()+1)}if(e.key==="ArrowLeft"){e.preventDefault();go(cur()-1)}};
 upd()}

 var tr=rows.map(function(b){return "<tr><td>"+b.fecha+"</td><td>"+b.hora+"</td><td>"+esc(b.nombre)+"</td><td>"+esc(b.tel)+"</td><td>"+esc(trTxt(b,"es"))+"</td><td>"+esc(b.estado||"")+"</td></tr>"}).join("");
 var html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Agenda</title><style>body{font-family:sans-serif;padding:24px}table{border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px 12px;text-align:left}th{background:#f6d9dd}</style></head><body><h1>Agenda de turnos</h1><table><tr><th>Fecha</th><th>Hora</th><th>Clienta</th><th>Teléfono</th><th>Tratamiento</th><th>Estado</th></tr>'+tr+'</table></body></html>';

function loadJs(src){return new Promise(function(ok,ko){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=function(){ko(new Error("No se pudo cargar "+src))};document.head.appendChild(s)})}
function pdfLib(){if(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable)return Promise.resolve(window.jspdf.jsPDF);
 return loadJs(API_URL+"/vendor/jspdf.js").then(function(){return loadJs(API_URL+"/vendor/autotable.js")}).then(function(){return window.jspdf.jsPDF})}
function pdfTxt(v){return String(v==null?"":v).replace(/[^\u0000-\u00ff·–—’“”]/g,"").trim()}
function makePdf(title,sub,head,body,file){return pdfLib().then(function(J){var doc=new J({orientation:"landscape",unit:"pt",format:"a4"}),W=doc.internal.pageSize.getWidth(),Hh=doc.internal.pageSize.getHeight();
 doc.setFillColor(51,38,44);doc.rect(0,0,W,70,"F");
 doc.setFont("times","bolditalic");doc.setFontSize(22);doc.setTextColor(228,197,140);doc.text("Mai Alisados",40,44);
 doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(255,255,255);doc.text(pdfTxt(title),W-40,38,{align:"right"});
 doc.setFontSize(8.5);doc.setTextColor(240,214,220);doc.text(pdfTxt(sub),W-40,54,{align:"right"});
 doc.autoTable({head:[head.map(pdfTxt)],body:body.map(function(r){return r.map(pdfTxt)}),startY:90,theme:"grid",
  styles:{font:"helvetica",fontSize:9,cellPadding:6,textColor:[42,34,38],lineColor:[237,220,212],lineWidth:.5},
  headStyles:{fillColor:[156,74,96],textColor:255,fontStyle:"bold"},alternateRowStyles:{fillColor:[250,245,241]},margin:{left:40,right:40,bottom:36},
  didDrawPage:function(){doc.setFontSize(8);doc.setTextColor(140,125,130);doc.text(pdfTxt(T("gen"))+" "+new Date().toLocaleDateString(lang==="es"?"es-AR":"en-US"),40,Hh-18);doc.text(String(doc.internal.getNumberOfPages()),W-40,Hh-18,{align:"right"})}});
 doc.save(file)})}

function openExport(){var opts="",cur=ymd(today).slice(0,7);
 for(var i=-12;i<=3;i++){var d=new Date(today.getFullYear(),today.getMonth()+i,1),k=ymd(d).slice(0,7);opts+='<option value="'+k+'"'+(k===cur?" selected":"")+'>'+MSLF[lang][d.getMonth()]+" "+d.getFullYear()+'</option>'}
 sheet('<h3>'+T("extitle")+' · PDF</h3><label for="mo">'+T("month")+'</label><select id="mo">'+opts+'</select><div class="row"><button class="btn ghost" id="x">'+T("close")+'</button><button class="btn rose" id="ok">'+T("pdf")+'</button></div>');
 $("x").onclick=close_;
 $("ok").onclick=function(){var v=$("mo").value,y=+v.slice(0,4),m=+v.slice(5,7),last=new Date(y,m,0).getDate(),b=$("ok");b.disabled=true;b.classList.add("loading");
  api("/api/turnos?desde="+v+"-01&hasta="+v+"-"+String(last).padStart(2,"0")).then(function(rows){
   if(!rows.length){toast(T("nores"));return}
   var body=rows.map(function(r){var t=r.data;return [fd(t.fecha),fh(t.hora),t.nombre,t.tel,trTxt(t)||"-",t.estado==="pendiente"?T("pend"):T("conf")]});
   return makePdf(T("extitle")+" · "+MSLF[lang][m-1]+" "+y,rows.length+" "+T("turnos"),[T("hdate"),T("hhour"),T("hclient"),T("hphone"),T("treat"),T("hstate")],body,"turnos-"+v+".pdf").then(function(){close_()})
  }).catch(function(e){console.error(e);toast(T("pdff"))}).then(function(){if($("ok")){$("ok").disabled=false;$("ok").classList.remove("loading")}})}}

/* ===== Horarios ===== */
function openHours(){var tmp={t1:H.t1.slice(),t2:H.t2.slice(),t3:H.t3.slice()};
 function draw(fk){var h='<h3>'+T("htitle")+'</h3><p class="hint" style="margin:0">'+T("hhint")+'</p>';
  ["t1","t2","t3"].forEach(function(k,ix){h+='<label for="nt'+k+'">'+T("s"+(ix+1))+'</label><div class="chips">'+(tmp[k].length?tmp[k].map(function(x,j){return '<span class="chip">'+fh(x)+'<button type="button" data-rm="'+k+'|'+j+'" aria-label="'+T("del")+' '+fh(x)+'">×</button></span>'}).join(""):'<small class="hint" style="margin:0">'+T("hempty")+'</small>')+'</div><div class="addrow"><input type="time" id="nt'+k+'" step="300"><button type="button" class="btn ghost sm" data-add="'+k+'">'+T("add")+'</button></div>'});
  sheet(h+'<div class="row"><button class="btn ghost" id="x">'+T("back")+'</button><button class="btn rose" id="ok">'+T("save")+'</button></div>');
  if(fk)setTimeout(function(){var e=$("nt"+fk);if(e)e.focus()},80);
  all("[data-rm]",function(b){b.onclick=function(){var p=b.dataset.rm.split("|");tmp[p[0]].splice(+p[1],1);draw(p[0])}});
  all("[data-add]",function(b){var k=b.dataset.add,go=function(){var v=$("nt"+k).value;if(!/^\d{2}:\d{2}$/.test(v)){$("nt"+k).focus();return}if(tmp[k].indexOf(v)<0){tmp[k].push(v);tmp[k].sort()}draw(k)};b.onclick=go;$("nt"+k).onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();go()}}});
  $("x").onclick=close_;
  $("ok").onclick=function(){var b=$("ok");b.disabled=true;b.classList.add("loading");db.collection("config").doc("horarios").set(tmp).then(function(){H={t1:tmp.t1,t2:tmp.t2,t3:tmp.t3};close_();render();toast(T("hsaved"))}).catch(function(){b.disabled=false;b.classList.remove("loading");toast(T("sfail"))})}}
 draw()}

function loadClients(){return api("/api/clientes").then(function(rows){clientes=rows.map(function(r){return Object.assign({id:r.id},r.data)}).sort(function(a,b){return a.nombre.localeCompare(b.nombre)});return clientes})}
function openClients(){sheet('<h3>'+T("ctitle")+'</h3><div class="skel" style="height:70px" aria-hidden="true"></div><span class="sr">'+T("load")+'</span>');
 loadClients().then(function(){drawClients("")}).catch(function(e){console.error(e);close_();toast(T("signin"))})}
function clientRows(q){var f=q.trim().toLowerCase(),fd2=f.replace(/\D/g,""),list=clientes.filter(function(c){return !f||c.nombre.toLowerCase().indexOf(f)>=0||(fd2.length>=3&&c.wa.indexOf(fd2)>=0)||(c.notas||"").toLowerCase().indexOf(f)>=0});
 return list.length?list.map(function(c){return '<div class="citem"><div class="ci"><b>'+esc(c.nombre)+'</b><small>'+esc(c.tel)+(c.ultimo?' · '+T("last")+': '+fd(c.ultimo):'')+'</small>'+(c.notas?'<small class="cn">'+esc(c.notas)+'</small>':'')+'</div><div class="ca"><a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(c.wa)+'">WhatsApp</a><button class="btn ghost sm" data-ed="'+esc(c.id)+'">'+T("edit")+'</button></div></div>'}).join(""):'<div class="empty">'+T("cnone")+'</div>'}
function drawClients(q){q=q||"";
 sheet('<h3>'+T("ctitle")+' <span class="cnt">'+clientes.length+'</span></h3><div class="crow"><button class="btn rose sm" id="cadd">+ '+T("cadd")+'</button><button class="btn ghost sm" id="cimp">'+T("imp")+'</button><button class="btn sm" id="cpdf"'+(clientes.length?'':' disabled')+'>'+T("pdf")+'</button></div><label for="cq" class="sr">'+T("search")+'</label><input id="cq" type="search" autocomplete="off" placeholder="'+T("search")+'" value="'+esc(q)+'"><div class="clist" id="clist">'+clientRows(q)+'</div><div class="row"><button class="btn ghost" id="x">'+T("close")+'</button></div>');
 var wire=function(){all("[data-ed]",function(b){b.onclick=function(){clientForm(clientes.filter(function(c){return c.id===b.dataset.ed})[0])}})};wire();
 $("cq").oninput=function(){$("clist").innerHTML=clientRows($("cq").value);wire()};
 $("cadd").onclick=function(){clientForm(null)};$("cimp").onclick=importForm;$("x").onclick=close_;
 $("cpdf").onclick=function(){var b=$("cpdf");b.disabled=true;b.classList.add("loading");
  makePdf(T("ctitle"),clientes.length+" "+T("total"),[T("hclient"),T("hphone"),T("last"),T("hnotes")],clientes.map(function(c){return [c.nombre,c.tel,c.ultimo?fd(c.ultimo):"-",c.notas||""]}),"clientas.pdf")
  .catch(function(e){console.error(e);toast(T("pdff"))}).then(function(){b.disabled=false;b.classList.remove("loading")})}}
function clientForm(c){var del=0;
 sheet('<h3>'+(c?T("cedit"):T("cadd"))+'</h3><label for="n">'+T("name")+'</label><input id="n" autocomplete="off" value="'+esc(c?c.nombre:"")+'"><label for="p">'+T("num")+'</label><div class="telrow"><input id="cc" type="tel" value="'+(c?"":"+1")+'" aria-label="'+T("code")+'"><input id="p" type="tel" inputmode="tel" placeholder="'+T("ph2")+'" value="'+esc(c?c.tel:"")+'"></div><label for="nt">'+T("notes")+'</label><textarea id="nt" rows="3">'+esc(c&&c.notas||"")+'</textarea><div class="row">'+(c?'<button class="btn ghost" id="del">'+T("del")+'</button>':'<button class="btn ghost" id="x">'+T("back")+'</button>')+'<button class="btn rose" id="ok">'+T("save")+'</button></div>'+(c?'<div class="row" style="margin-top:10px"><button class="btn ghost" id="x">'+T("back")+'</button></div>':''));
 $("x").onclick=function(){drawClients("")};
 if(c)$("del").onclick=function(){if(!del){del=1;$("del").textContent=T("sure");$("del").classList.add("danger");return}
  db.collection("clientes").doc(c.id).delete().then(loadClients).then(function(){toast(T("cdel"));drawClients("")}).catch(function(){toast(T("cfail"))})};
 $("ok").onclick=function(){var n=$("n").value.trim(),ph=normTel($("cc").value,$("p").value);
  if(n.length<2){fieldErr("n",T("errn"));return}if(!ph){fieldErr("p",T("errp"));return}fieldErr(null);var b=$("ok");b.disabled=true;b.classList.add("loading");
  var id="c"+ph.wa,data={nombre:n,tel:ph.tel,wa:ph.wa,notas:$("nt").value.trim()};
  db.collection("clientes").doc(id).set(data).then(function(){if(c&&c.id!==id)return db.collection("clientes").doc(c.id).delete()})
   .then(loadClients).then(function(){toast(T("csaved"));drawClients("")}).catch(function(){b.disabled=false;b.classList.remove("loading");toast(T("sfail"))})}}
function importForm(){
 sheet('<h3>'+T("imp")+'</h3><p class="hint" style="margin:0">'+T("imphint")+'</p><label for="il" class="sr">'+T("imp")+'</label><textarea id="il" rows="9" placeholder="Ana López, +1 305 555 1234&#10;María Pérez, 786 555 9876"></textarea><div class="row"><button class="btn ghost" id="x">'+T("back")+'</button><button class="btn rose" id="ok">'+T("impbtn")+'</button></div>');
 $("x").onclick=function(){drawClients("")};
 $("ok").onclick=function(){var items=[],skip=0;$("il").value.split(/\r?\n/).forEach(function(line){line=line.trim();if(!line)return;
   var m=line.match(/^(.*?)[,;\t]+\s*([+()\d][\d\s()+.\-]{5,})\s*$/)||line.match(/^(.*?\D)\s*([+(]?\d[\d\s()+.\-]{5,})\s*$/);
   var ph=m&&normTel("+1",m[2]),n=m&&m[1].replace(/[,;\t]+$/,"").trim();
   if(!ph||!n||n.length<2){skip++;return}items.push({nombre:n,tel:ph.tel,wa:ph.wa})});
  if(!items.length){fieldErr("il",T("impskip").replace(/^./,function(x){return x.toUpperCase()})+": "+skip);return}
  var b=$("ok");b.disabled=true;b.classList.add("loading");
  api("/api/clientes/import",{method:"POST",body:JSON.stringify({items:items})}).then(function(r){return loadClients().then(function(){toast(r.cargadas+" "+T("impdone")+(skip?" · "+skip+" "+T("impskip"):""));drawClients("")})})
   .catch(function(){b.disabled=false;b.classList.remove("loading");toast(T("sfail"))})}}

var lastFocus=null;
function sheet(h){if(!$("ov").classList.contains("on"))lastFocus=document.activeElement;$("sheet").innerHTML=h.replace("<h3>",'<h3 id="shT">');$("ov").classList.add("on");
 var f=$("sheet").querySelector("input,select,button");if(f)setTimeout(function(){f.focus()},60)}
function close_(){if(!$("ov").classList.contains("on"))return;$("ov").classList.remove("on");if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus()}
document.addEventListener("keydown",function(e){if(!$("ov").classList.contains("on"))return;
 if(e.key==="Escape"){e.preventDefault();close_();return}
 if(e.key==="Tab"){var f=$("sheet").querySelectorAll("input,select,button,a[href]"),v=Array.prototype.filter.call(f,function(x){return x.offsetParent!==null&&!x.disabled});if(!v.length)return;
  var a=v[0],z=v[v.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
function fieldErr(id,msg){all("#sheet .field-err",function(x){x.remove()});all("#sheet [aria-invalid]",function(x){x.removeAttribute("aria-invalid")});
 if(!id)return;var el=$(id);el.setAttribute("aria-invalid","true");el.setAttribute("aria-describedby",id+"E");el.insertAdjacentHTML("afterend",'<span class="field-err" id="'+id+'E">'+esc(msg)+'</span>');el.focus()}
$("ov").onclick=function(e){if(e.target===$("ov"))close_()};
all(".lang button",function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}close_();render()}});
function openBook(k,hr){
 if(!db||(!uid&&!ownerMode)){toast(T("login"));return}
 var opts=CC.map(function(c){return '<option value="'+c[0]+'">'+(lang==="en"?c[1]:c[2])+(c[0]==="other"?"":" +"+c[0])+'</option>'}).join("");
 sheet('<h3>'+(ownerMode?T("addc"):T("book"))+'</h3><div style="color:var(--mut)">'+fd(sel)+' · '+fh(hr)+'</div><label for="n">'+T("name")+'</label><input id="n" autocomplete="name"'+(ownerMode&&clientes.length?' list="cldl"':'')+'>'+(ownerMode&&clientes.length?'<datalist id="cldl">'+clientes.map(function(c){return '<option value="'+esc(c.nombre)+'">'+esc(c.tel)+'</option>'}).join("")+'</datalist>':'')+'<label for="p">'+T("num")+'</label><div class="telrow"><input id="cc" type="tel" inputmode="tel" autocomplete="tel-country-code" value="+1" aria-label="'+T("code")+'"><input id="p" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="'+T("ph2")+'"></div><small class="hint">'+T("phint")+'</small>'+'<label for="tr">'+T("treat")+'</label><select id="tr">'+TR.map(function(x){return '<option value="'+x[0]+'">'+x[1]+' · '+durf(x[2],lang)+'</option>'}).join("")+'</select><label class="chk" for="hy"><input type="checkbox" id="hy"> '+T("hyd")+'</label>'+(ownerMode?'<label for="ml">'+T("msgl")+'</label><select id="ml"><option value="es">Español</option><option value="en">English</option></select>':'')+'<div class="row"><button class="btn ghost" id="x">'+T("back")+'</button><button class="btn rose" id="ok">'+T("ok")+'</button></div>');

   await ref.set(bk);
